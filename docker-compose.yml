services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-autoelite}
      DB_USER: ${DB_USER:-autoelite}
      DB_PASS: ${DB_PASS:-autoelite_pass}
    volumes:
      - .:/var/www/html          
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-autoelite}
      MYSQL_USER: ${DB_USER:-autoelite}
      MYSQL_PASSWORD: ${DB_PASS:-autoelite_pass}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  dbdata:
